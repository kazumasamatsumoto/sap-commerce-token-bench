# 計測台の全体。postgres(DB)、builder(ant の中身を動かす Gradle)、commerce(疑似 Commerce)、storefront(SSR)。
# ant / hybrisserver.sh は core-customize/hybris/bin/platform/ から呼ぶ。直接このファイルを触る必要は少ない。
name: xyz-commerce

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hybris
      POSTGRES_USER: hybris
      POSTGRES_PASSWORD: hybris
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hybris -d hybris"]
      interval: 2s
      timeout: 3s
      retries: 30

  builder:
    image: gradle:8.14.6-jdk21-noble
    profiles: ["tools"]
    working_dir: /workspace/core-customize/hybris/bin/platform
    environment:
      GRADLE_USER_HOME: /gradle-home
      HYBRIS_DB_URL: jdbc:postgresql://postgres:5432/hybris
    volumes:
      - ./:/workspace
      - gradle-home:/gradle-home
    depends_on:
      postgres:
        condition: service_healthy

  commerce:
    image: gradle:8.14.6-jdk21-noble
    working_dir: /workspace/core-customize/hybris/bin/platform
    command: ["java", "-jar", "build/libs/commerce.jar", "--hybris.mode=server"]
    environment:
      HYBRIS_DB_URL: jdbc:postgresql://postgres:5432/hybris
    ports:
      - "9002:9002"
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    image: node:22.23.3-bookworm-slim
    profiles: ["storefront"]
    working_dir: /workspace/storefront
    command: ["node", "dist/storefront/server/server.mjs"]
    environment:
      PORT: "4000"
      OCC_BASE_URL: http://commerce:9002
    ports:
      - "4000:4000"
    volumes:
      - ./:/workspace
    depends_on:
      - commerce

volumes:
  pgdata:
  gradle-home:
