        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===================================================================== Brands (xyzocc)
  /{baseSiteId}/brands:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    get:
      tags: [Brands]
      operationId: getBrands
      summary: List active brands
      description: 有効なブランドの一覧を返します (自社拡張 xyzocc)。ログインは要りません。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandListWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"

  /{baseSiteId}/brands/{brandCode}:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - name: brandCode
        in: path
        required: true
        description: ブランドのコード。
        schema:
          type: string
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    get:
      tags: [Brands]
      operationId: getBrand
      summary: Get a brand
      description: ブランドを 1 つコードで返します (自社拡張 xyzocc)。ログインは要りません。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        `POST http://localhost:9002/authorizationserver/oauth/token` (form 形式、client_id / client_secret は本文に入れる) で取ったトークンを
        `Authorization: Bearer <token>` で送ります。
        password: client_id=mobile_android, client_secret=secret, username=taro@example.com, password=Test1234! → 顧客のロール。
        clientCredentials: client_id=trusted_client, client_secret=secret → ROLE_TRUSTED_CLIENT。
      flows:
        password:
          tokenUrl: http://localhost:9002/authorizationserver/oauth/token
          scopes:
            basic: 基本のスコープ
            openid: OpenID
        clientCredentials:
          tokenUrl: http://localhost:9002/authorizationserver/oauth/token
          scopes:
            basic: 基本のスコープ
            openid: OpenID

  parameters:
    baseSiteId:
      name: baseSiteId
      in: path
      required: true
      description: ベースサイトの ID。無いサイトは 400 InvalidResourceError。
      schema:
        type: string
        example: electronics-spa
    userId:
      name: userId
      in: path
      required: true
      description: "`current` (トークンの本人)、`anonymous` (ゲスト)、または uid (本人か ROLE_TRUSTED_CLIENT のみ)。"
      schema:
        type: string
        example: current
    cartId:
      name: cartId
      in: path
      required: true
      description: カートのコード。ゲスト (userId=anonymous) はカートの guid。
      schema:
        type: string
    addressId:
      name: addressId
      in: path
      required: true
      description: 住所の ID。
      schema:
        type: string
    entryNumber:
      name: entryNumber
      in: path
      required: true
      description: カートの明細の番号 (0 から)。
      schema:
        type: integer
        format: int32
    productCode:
      name: productCode
      in: path
      required: true
      description: 商品コード。
      schema:
        type: string
        example: XYZ-000001
    categoryId:
      name: categoryId
      in: path
      required: true
      description: カテゴリのコード。
      schema:
        type: string
    fields:
      name: fields
      in: query
      required: false
      description: |
        返す項目の絞り込み。BASIC / DEFAULT / FULL のレベルか、`code,name,price(FULL)` のような項目の指定。
      schema:
        type: string
        default: DEFAULT
        example: DEFAULT
    lang:
      name: lang
      in: query
      required: false
      description: 言語の isocode (例 ja, en)。省くとサイトの既定の言語。
      schema:
        type: string
    curr:
      name: curr
      in: query
      required: false
      description: 通貨の isocode (例 JPY, USD)。省くとストアの既定の通貨。
      schema:
        type: string
    currentPage:
      name: currentPage
      in: query
      required: false
      description: ページの番号 (0 から)。
      schema:
        type: integer
        format: int32
        default: 0
    pageSize:
      name: pageSize
      in: query
      required: false
      description: 1 ページの件数 (1〜100 に丸められます)。
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 100
    sort:
      name: sort
      in: query
      required: false
      description: 並び順のコード (例 relevance, topRated, name-asc, price-asc)。
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        入力の誤り。type は UnknownIdentifierError / InvalidResourceError / CartError / InvalidCartError /
        DuplicateUidError / CMSItemNotFoundError / ValidationError / MissingServletRequestParameterError のいずれか。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorListWsDTO"
          example:
            errors:
              - type: ValidationError
                message: quantity must not be negative
                subject: quantity
    Unauthorized:
      description: ログインが必要 (UnauthorizedError)。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorListWsDTO"
          example:
            errors:
              - type: UnauthorizedError
                message: Full authentication is required to access this resource
    Forbidden:
      description: 権限が足りない (ForbiddenError)。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorListWsDTO"
          example:
            errors:
              - type: ForbiddenError
                message: Access is denied
    InternalError:
      description: サーバーの中のエラー。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorListWsDTO"

  schemas:
    # ------------------------------------------------------------ error
    ErrorWsDTO:
      type: object
      properties:
        type:
          type: string
          example: UnknownIdentifierError
        reason:
          type: string
        message:
          type: string
        subject:
          type: string
        subjectType:
          type: string
    ErrorListWsDTO:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorWsDTO"

    # ------------------------------------------------------------ product
    PriceWsDTO:
      type: object
      properties:
        currencyIso:
          type: string
        value:
          type: number
        formattedValue:
          type: string
        priceType:
          type: string
    ImageWsDTO:
      type: object
      properties:
        url:
          type: string
        altText:
          type: string
        format:
          type: string
        imageType:
          type: string
        galleryIndex:
          type: integer
          format: int32
    StockWsDTO:
      type: object
      properties:
        stockLevel:
          type: integer
          format: int64
        stockLevelStatus:
          type: string
    CategoryWsDTO:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        url:
          type: string
        image:
          $ref: "#/components/schemas/ImageWsDTO"
    PrincipalWsDTO:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
    ReviewWsDTO:
      type: object
      properties:
        id:
          type: string
        headline:
          type: string
        comment:
          type: string
        rating:
          type: number
          format: double
        date:
          type: string
          format: date-time
        alias:
          type: string
        principal:
          $ref: "#/components/schemas/PrincipalWsDTO"
    ReviewListWsDTO:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ReviewWsDTO"
    ProductWsDTO:
      type: object
      description: 商品。brand / newArrival / material は自社拡張 (xyzocc-beans.xml) で足した項目。
      properties:
        code:
          type: string
        name:
          type: string
        summary:
          type: string
        description:
          type: string
        url:
          type: string
        manufacturer:
          type: string
        ean:
          type: string
        purchasable:
          type: boolean
        price:
          $ref: "#/components/schemas/PriceWsDTO"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageWsDTO"
        stock:
          $ref: "#/components/schemas/StockWsDTO"
        averageRating:
          type: number
          format: double
        numberOfReviews:
          type: integer
          format: int32
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryWsDTO"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ReviewWsDTO"
        brand:
          $ref: "#/components/schemas/BrandWsDTO"
        newArrival:
          type: boolean
        material:
          type: string

    # ------------------------------------------------------------ search
    PaginationWsDTO:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        totalResults:
          type: integer
          format: int64
        sort:
          type: string
    SortWsDTO:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        selected:
          type: boolean
    SearchQueryWsDTO:
      type: object
      properties:
        value:
          type: string
    SearchStateWsDTO:
      type: object
      properties:
        url:
          type: string
        query:
          $ref: "#/components/schemas/SearchQueryWsDTO"
    FacetValueWsDTO:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
          format: int64
        selected:
          type: boolean
        query:
          $ref: "#/components/schemas/SearchStateWsDTO"
    FacetWsDTO:
      type: object
      properties:
        name:
          type: string
        category:
          type: boolean
        multiSelect:
          type: boolean
        visible:
          type: boolean
        values:
          type: array
          items:
            $ref: "#/components/schemas/FacetValueWsDTO"
    ProductSearchPageWsDTO:
      type: object
      properties:
        freeTextSearch:
          type: string
        currentQuery:
          $ref: "#/components/schemas/SearchStateWsDTO"
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductWsDTO"
        facets:
          type: array
          items:
            $ref: "#/components/schemas/FacetWsDTO"
        pagination:
          $ref: "#/components/schemas/PaginationWsDTO"
        sorts:
          type: array
          items:
            $ref: "#/components/schemas/SortWsDTO"
    SuggestionWsDTO:
      type: object
      properties:
        value:
          type: string
    SuggestionListWsDTO:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SuggestionWsDTO"

    # ------------------------------------------------------------ store session / user
    LanguageWsDTO:
      type: object
      properties:
        isocode:
          type: string
        name:
          type: string
        nativeName:
          type: string
        active:
          type: boolean
    LanguageListWsDTO:
      type: object
      properties:
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageWsDTO"
    CurrencyWsDTO:
      type: object
      properties:
        isocode:
          type: string
        name:
          type: string
        symbol:
          type: string
        active:
          type: boolean
    CurrencyListWsDTO:
      type: object
      properties:
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyWsDTO"
    CountryWsDTO:
      type: object
      properties:
        isocode:
          type: string
        name:
          type: string
    CountryListWsDTO:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/CountryWsDTO"
    TitleWsDTO:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    TitleListWsDTO:
      type: object
      properties:
        titles:
          type: array
          items:
            $ref: "#/components/schemas/TitleWsDTO"
    AddressWsDTO:
      type: object
      description: 住所。作るときは firstName, lastName, line1, town, postalCode (123-4567), country.isocode が必須。
      properties:
        id:
          type: string
        titleCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        line1:
          type: string
        line2:
          type: string
        town:
          type: string
        postalCode:
          type: string
          pattern: '^\d{3}-?\d{4}$'
        phone:
          type: string
        email:
          type: string
        country:
          $ref: "#/components/schemas/CountryWsDTO"
        shippingAddress:
          type: boolean
        billingAddress:
          type: boolean
        defaultAddress:
          type: boolean
        visibleInAddressBook:
          type: boolean
        formattedAddress:
          type: string
    AddressListWsDTO:
      type: object
      properties:
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/AddressWsDTO"
    B2BUnitWsDTO:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        active:
          type: boolean
    B2BUnitListWsDTO:
      type: object
      properties:
        units:
          type: array
          items:
            $ref: "#/components/schemas/B2BUnitWsDTO"
    UserWsDTO:
      allOf:
        - $ref: "#/components/schemas/PrincipalWsDTO"
        - type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            titleCode:
              type: string
            displayUid:
              type: string
            customerId:
              type: string
            currency:
              $ref: "#/components/schemas/CurrencyWsDTO"
            language:
              $ref: "#/components/schemas/LanguageWsDTO"
            defaultAddress:
              $ref: "#/components/schemas/AddressWsDTO"
            orgUnit:
              $ref: "#/components/schemas/B2BUnitWsDTO"
    UserSignUpWsDTO:
      type: object
      required: [uid, password]
      properties:
        uid:
          type: string
          format: email
          description: ログイン ID (メールアドレス)。
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        titleCode:
          type: string

    # ------------------------------------------------------------ order / cart
    DeliveryModeWsDTO:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        deliveryCost:
          $ref: "#/components/schemas/PriceWsDTO"
    DeliveryModeListWsDTO:
      type: object
      properties:
        deliveryModes:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryModeWsDTO"
    CardTypeWsDTO:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    PaymentDetailsWsDTO:
      type: object
      properties:
        id:
          type: string
        accountHolderName:
          type: string
        cardNumber:
          type: string
        cardType:
          $ref: "#/components/schemas/CardTypeWsDTO"
        expiryMonth:
          type: string
        expiryYear:
          type: string
        defaultPayment:
          type: boolean
        billingAddress:
          $ref: "#/components/schemas/AddressWsDTO"
    OrderEntryWsDTO:
      type: object
      properties:
        entryNumber:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int64
        basePrice:
          $ref: "#/components/schemas/PriceWsDTO"
        totalPrice:
          $ref: "#/components/schemas/PriceWsDTO"
        product:
          $ref: "#/components/schemas/ProductWsDTO"
        updateable:
          type: boolean
    OrderEntryListWsDTO:
      type: object
      properties:
        orderEntries:
          type: array
          items:
            $ref: "#/components/schemas/OrderEntryWsDTO"
    AbstractOrderWsDTO:
      type: object
      properties:
        code:
          type: string
        guid:
          type: string
        net:
          type: boolean
        calculated:
          type: boolean
        site:
          type: string
        store:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/OrderEntryWsDTO"
        totalItems:
          type: integer
          format: int32
        totalUnitCount:
          type: integer
          format: int32
        subTotal:
          $ref: "#/components/schemas/PriceWsDTO"
        deliveryCost:
          $ref: "#/components/schemas/PriceWsDTO"
        totalTax:
          $ref: "#/components/schemas/PriceWsDTO"
        totalPrice:
          $ref: "#/components/schemas/PriceWsDTO"
        totalPriceWithTax:
          $ref: "#/components/schemas/PriceWsDTO"
        deliveryAddress:
          $ref: "#/components/schemas/AddressWsDTO"
        deliveryMode:
          $ref: "#/components/schemas/DeliveryModeWsDTO"
        paymentInfo:
          $ref: "#/components/schemas/PaymentDetailsWsDTO"
        user:
          $ref: "#/components/schemas/PrincipalWsDTO"
    CartWsDTO:
      allOf:
        - $ref: "#/components/schemas/AbstractOrderWsDTO"
        - type: object
          properties:
            saveTime:
              type: string
              format: date-time
    CartListWsDTO:
      type: object
      properties:
        carts:
          type: array
          items:
            $ref: "#/components/schemas/CartWsDTO"
    OrderWsDTO:
      allOf:
        - $ref: "#/components/schemas/AbstractOrderWsDTO"
        - type: object
          properties:
            created:
              type: string
              format: date-time
            status:
              type: string
            statusDisplay:
              type: string
            guestCustomer:
              type: boolean
    CartModificationWsDTO:
      type: object
      properties:
        statusCode:
          type: string
        statusMessage:
          type: string
        quantityAdded:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
        entry:
          $ref: "#/components/schemas/OrderEntryWsDTO"
    OrderHistoryWsDTO:
      type: object
      properties:
        code:
          type: string
        guid:
          type: string
        status:
          type: string
        statusDisplay:
          type: string
        placed:
          type: string
          format: date-time
        total:
          $ref: "#/components/schemas/PriceWsDTO"
    OrderHistoryListWsDTO:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderHistoryWsDTO"
        pagination:
          $ref: "#/components/schemas/PaginationWsDTO"
        sorts:
          type: array
          items:
            $ref: "#/components/schemas/SortWsDTO"

    # ------------------------------------------------------------ base site / catalog
    BaseSiteWsDTO:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        channel:
          type: string
        defaultLanguage:
          $ref: "#/components/schemas/LanguageWsDTO"
        stores:
          type: array
          items:
            type: string
    BaseSiteListWsDTO:
      type: object
      properties:
        baseSites:
          type: array
          items:
            $ref: "#/components/schemas/BaseSiteWsDTO"
    CategoryHierarchyWsDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        subcategories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryHierarchyWsDTO"
    CatalogVersionWsDTO:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryHierarchyWsDTO"
    CatalogWsDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        catalogVersions:
          type: array
          items:
            $ref: "#/components/schemas/CatalogVersionWsDTO"
    CatalogListWsDTO:
      type: object
      properties:
        catalogs:
          type: array
          items:
            $ref: "#/components/schemas/CatalogWsDTO"

    # ------------------------------------------------------------ CMS
    ComponentWsDTO:
      type: object
      description: |
        CMS コンポーネント。Java 側の otherProperties (Map<String,Object>) は @JsonAnyGetter で
        コンポーネントの項目として平たく出力されるため、`otherProperties` というキーは現れず、
        種類ごとの項目 (例 headline, media, urlLink など) が直接並びます。
      properties:
        uid:
          type: string
        uuid:
          type: string
        typeCode:
          type: string
        name:
          type: string
        modifiedtime:
          type: string
          format: date-time
      additionalProperties: true
    ComponentListWsDTO:
      type: object
      properties:
        component:
          type: array
          items:
            $ref: "#/components/schemas/ComponentWsDTO"
    ContentSlotWsDTO:
      type: object
      properties:
        slotId:
          type: string
        position:
          type: string
        name:
          type: string
        components:
          $ref: "#/components/schemas/ComponentListWsDTO"
    ContentSlotListWsDTO:
      type: object
      properties:
        contentSlot:
          type: array
          items:
            $ref: "#/components/schemas/ContentSlotWsDTO"
    CMSPageWsDTO:
      type: object
      properties:
        uid:
          type: string
        uuid:
          type: string
        title:
          type: string
        template:
          type: string
        typeCode:
          type: string
        name:
          type: string
        label:
          type: string
        contentSlots:
          $ref: "#/components/schemas/ContentSlotListWsDTO"
    ListComponentWsDTO:
      type: object
      properties:
        component:
          type: array
          items:
            $ref: "#/components/schemas/ComponentWsDTO"
        pagination:
          $ref: "#/components/schemas/PaginationWsDTO"

    # ------------------------------------------------------------ xyzocc (brand)
    BrandWsDTO:
      type: object
      description: ブランド (自社拡張 xyzocc)。
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        tier:
          type: string
        logo:
          $ref: "#/components/schemas/ImageWsDTO"
    BrandListWsDTO:
      type: object
      properties:
        brands:
          type: array
          items:
            $ref: "#/components/schemas/BrandWsDTO"
