openapi: 3.0.3
info:
  title: Pseudo SAP Commerce OCC API (platform-lite + xyzocc)
  version: "2.0-lite"
  description: |
    トークン計測ベンチで使う、SAP Commerce OCC v2 を真似た擬似 API です。
    コードは `core-customize/hybris/bin/platform-lite` (標準の OCC 相当) と
    `core-customize/hybris/bin/custom/xyzocc` (自社のブランド API) にあります。

    - サーバー: `http://localhost:9002/occ/v2` (下のパスはすべてこの後ろに付きます)
    - ベースサイト: `electronics-spa` (`{baseSiteId}` に入れます。無いサイトは 400 InvalidResourceError)
    - テスト用ユーザー: `taro@example.com` / `hanako@example.com` (パスワードはどちらも `Test1234!`)
    - OAuth クライアント: `mobile_android` / `secret`

    ## トークンの取り方
    トークンは `/occ/v2` の外にある `POST http://localhost:9002/authorizationserver/oauth/token` で取ります
    (`application/x-www-form-urlencoded`、client_id と client_secret は本文に入れます)。
    - `grant_type=password` + `client_id=mobile_android` + `client_secret=secret` + `username` + `password`
      … 顧客のトークン (ROLE_CLIENT と、ユーザーのグループに応じた ROLE_CUSTOMERGROUP / ROLE_B2BCUSTOMERGROUP など)
    - `grant_type=client_credentials` + `client_id=trusted_client` + `client_secret=secret`
      … 信頼されたクライアントのトークン (ROLE_CLIENT, ROLE_TRUSTED_CLIENT)。`mobile_android` で取ると ROLE_CLIENT だけ
    - 成功時: `{"access_token":"...","token_type":"bearer","expires_in":...,"scope":"basic openid"}`
    - 失敗時: 401 `{"error":"invalid_client"}` / 400 `{"error":"invalid_grant"}` / 400 `{"error":"unsupported_grant_type"}`

    取ったトークンは `Authorization: Bearer <access_token>` で送ります。トークンなしの呼び出しは ROLE_ANONYMOUS 扱いです。

    ## {userId} の決まり
    - `current` … トークンの本人 (トークンが無いと 401 UnauthorizedError)
    - `anonymous` … ゲスト。カートの `{cartId}` にはカートの guid を使います
    - それ以外の uid … 本人か ROLE_TRUSTED_CLIENT だけ (他人なら 403 ForbiddenError)

    ## エラーの形
    エラーはすべて `ErrorListWsDTO` (`{"errors":[{"type":"...Error","message":"...","subject":"...","reason":"..."}]}`) で返ります。
    主な type: 400 = UnknownIdentifierError / InvalidResourceError / CartError / InvalidCartError / DuplicateUidError /
    CMSItemNotFoundError / ValidationError / MissingServletRequestParameterError、401 = UnauthorizedError、
    403 = ForbiddenError、404 = NotFoundError、405 = HttpRequestMethodNotSupportedError、500 = その他。
servers:
  - url: http://localhost:9002/occ/v2
    description: ローカルの platform-lite

tags:
  - name: Address
  - name: BaseSites
  - name: Carts
  - name: Catalogs
  - name: CmsPages
  - name: Miscs
  - name: Orders
  - name: OrgUnits
  - name: Products
  - name: Users
  - name: Brands

paths:
  # ===================================================================== BaseSites
  /basesites:
    get:
      tags: [BaseSites]
      operationId: getBaseSites
      summary: List base sites
      description: すべてのベースサイトの一覧を返します。ログインは要りません。
      security:
        - {}
        - oauth2: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseSiteListWsDTO"
        "500":
          $ref: "#/components/responses/InternalError"

  # ===================================================================== Address
  /{baseSiteId}/users/{userId}/addresses:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    get:
      tags: [Address]
      operationId: getAddresses
      summary: Get the user's address book
      description: ユーザーの住所録を返します。使えるのは ROLE_CUSTOMERGROUP か ROLE_TRUSTED_CLIENT だけです。
      security:
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressListWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Address]
      operationId: createAddress
      summary: Create an address
      description: 住所録に住所を足します。firstName・lastName・line1・town・postalCode (123-4567 の形)・country.isocode が必須で、使えるのは ROLE_CUSTOMERGROUP か ROLE_TRUSTED_CLIENT だけです。
      security:
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressWsDTO"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{baseSiteId}/users/{userId}/addresses/{addressId}:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/addressId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    get:
      tags: [Address]
      operationId: getAddress
      summary: Get an address
      description: 住所録の住所を 1 件返します。使えるのは ROLE_CUSTOMERGROUP か ROLE_TRUSTED_CLIENT だけです。
      security:
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Address]
      operationId: updateAddress
      summary: Partially update an address
      description: 送った項目だけ住所を書き換えます (本文は返りません)。使えるのは ROLE_CUSTOMERGROUP か ROLE_TRUSTED_CLIENT だけです。
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressWsDTO"
      responses:
        "200":
          description: OK (本文なし)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Address]
      operationId: deleteAddress
      summary: Delete an address
      description: 住所録から住所を消します。使えるのは ROLE_CUSTOMERGROUP か ROLE_TRUSTED_CLIENT だけです。
      security:
        - oauth2: []
      responses:
        "200":
          description: OK (本文なし)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===================================================================== Carts
  /{baseSiteId}/users/{userId}/carts:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    get:
      tags: [Carts]
      operationId: getCarts
      summary: Get the user's carts
      description: ユーザーのカートの一覧を返します。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます (トークンなしでも可)。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartListWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Carts]
      operationId: createCart
      summary: Create a cart
      description: 新しいカートを作ります。ゲスト (userId=anonymous) は返った guid を以後の cartId に使います。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{baseSiteId}/users/{userId}/carts/{cartId}:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/cartId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    get:
      tags: [Carts]
      operationId: getCart
      summary: Get a cart
      description: カートを 1 つ返します。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Carts]
      operationId: deleteCart
      summary: Delete a cart
      description: カートを消します。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      responses:
        "200":
          description: OK (本文なし)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{baseSiteId}/users/{userId}/carts/{cartId}/entries:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/cartId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    get:
      tags: [Carts]
      operationId: getCartEntries
      summary: Get cart entries
      description: カートの明細 (商品の行) の一覧を返します。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEntryListWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Carts]
      operationId: addCartEntry
      summary: Add a product to the cart
      description: 商品をカートに入れます。本文は {"product":{"code":"..."},"quantity":1} で、quantity を省くと 1 です。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderEntryWsDTO"
            example:
              product:
                code: XYZ-000001
              quantity: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartModificationWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{baseSiteId}/users/{userId}/carts/{cartId}/entries/{entryNumber}:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/cartId"
      - $ref: "#/components/parameters/entryNumber"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    patch:
      tags: [Carts]
      operationId: updateCartEntry
      summary: Update the quantity of a cart entry
      description: 明細の数量を変えます。本文は {"quantity":2} で、0 なら明細を消し、負の数は 400 です。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderEntryWsDTO"
            example:
              quantity: 2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartModificationWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Carts]
      operationId: removeCartEntry
      summary: Remove a cart entry
      description: 明細をカートから消します (数量を 0 にするのと同じ)。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      responses:
        "200":
          description: OK (本文なし)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{baseSiteId}/users/{userId}/carts/{cartId}/addresses/delivery:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/cartId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    put:
      tags: [Carts]
      operationId: setDeliveryAddress
      summary: Set the delivery address of the cart
      description: カートの配送先を決めます。住所録の住所なら addressId を、新しい住所なら本文に住所を入れます (どちらも無いと 400)。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - name: addressId
          in: query
          required: false
          description: 住所録の住所の ID。指定すると本文は使いません。
          schema:
            type: string
      requestBody:
        required: false
        description: addressId を指定しないときの新しい住所 (createAddress と同じ必須項目)。
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressWsDTO"
      responses:
        "200":
          description: OK (本文なし)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Carts]
      operationId: removeDeliveryAddress
      summary: Remove the delivery address from the cart
      description: カートの配送先を外します。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      responses:
        "200":
          description: OK (本文なし)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{baseSiteId}/users/{userId}/carts/{cartId}/deliverymodes:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/cartId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    get:
      tags: [Carts]
      operationId: getSupportedDeliveryModes
      summary: Get supported delivery modes
      description: このカートで選べる配送方法の一覧を返します。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryModeListWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{baseSiteId}/users/{userId}/carts/{cartId}/deliverymode:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/cartId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    put:
      tags: [Carts]
      operationId: setDeliveryMode
      summary: Set the delivery mode of the cart
      description: カートの配送方法を deliveryModeId で決めます。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - name: deliveryModeId
          in: query
          required: true
          description: 配送方法のコード (getSupportedDeliveryModes の code)。
          schema:
            type: string
      responses:
        "200":
          description: OK (本文なし)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Carts]
      operationId: getDeliveryMode
      summary: Get the delivery mode of the cart
      description: カートで選ばれている配送方法を返します (未選択なら空のオブジェクト)。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryModeWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{baseSiteId}/users/{userId}/carts/{cartId}/paymentdetails:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/cartId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    post:
      tags: [Carts]
      operationId: addPaymentDetails
      summary: Add payment details to the cart
      description: カートに支払い情報 (カード) を付けます。使うのは accountHolderName・cardNumber・expiryMonth・expiryYear です。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - $ref: "#/components/parameters/fields"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentDetailsWsDTO"
            example:
              accountHolderName: Taro Yamada
              cardNumber: "4111111111111111"
              expiryMonth: "12"
              expiryYear: "2030"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDetailsWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{baseSiteId}/users/{userId}/carts/{cartId}/email:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/userId"
      - $ref: "#/components/parameters/cartId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    put:
      tags: [Carts]
      operationId: setCartEmail
      summary: Set the guest email of the cart
      description: ゲストのカートにメールアドレスを付けます (ゲストの注文に必要)。ROLE_CUSTOMERGROUP・ROLE_TRUSTED_CLIENT・ROLE_ANONYMOUS・ROLE_CLIENT が使えます。
      security:
        - {}
        - oauth2: []
      parameters:
        - name: email
          in: query
          required: true
          description: ゲストのメールアドレス。形が正しくないと 400 ValidationError。
          schema:
            type: string
            format: email
      responses:
        "200":
          description: OK (本文なし)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===================================================================== Catalogs
  /{baseSiteId}/catalogs:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - $ref: "#/components/parameters/lang"
      - $ref: "#/components/parameters/curr"
    get:
      tags: [Catalogs]
      operationId: getCatalogs
      summary: List catalogs with category tree
      description: サイトの商品カタログと、カテゴリの木 (2 段まで) を返します。ログインは要りません。
      security:
        - {}
        - oauth2: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListWsDTO"
        "400":
          $ref: "#/components/responses/BadRequest"

  /{baseSiteId}/catalogs/{catalogId}/{catalogVersionId}/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/baseSiteId"
      - name: catalogId
        in: path
        required: true
        description: カタログの ID。
        schema:
