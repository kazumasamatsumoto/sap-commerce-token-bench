# 本物の Commerce の local.properties と同じ役目。値は platformlite が読む。
# DB の接続先は環境変数 HYBRIS_DB_URL があればそちらが勝つ(Docker の中では postgres:5432)。
db.url=jdbc:postgresql://localhost:5432/hybris
db.username=hybris
db.password=hybris

# OCC
tomcat.http.port=9002
occ.rewrite.overlapping.paths.enabled=true
webroot.ycommercewebservices=/occ/v2

# サイトとカタログ
xyz.default.baseSite=electronics-spa
xyz.default.productCatalog=electronicsProductCatalog
xyz.default.contentCatalog=electronicsContentCatalog
xyz.default.catalogVersion=Online

# 言語と通貨
lang.packs=ja,en
default.session.language.isocode=ja
default.session.currency.isocode=JPY

# OAuth(疑似。ストアフロントの client_id と同じにする)
oauth.client.mobile_android.secret=secret

# ImpEx
impex.import.workers=1
impex.legacy.mode=false
