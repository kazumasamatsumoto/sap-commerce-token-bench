# 疑似プラットフォームの Spring Boot の設定。案件の値は config/local.properties に書く(そちらを読み込む)。
spring.config.import=optional:classpath:local.properties
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true

spring.datasource.url=${HYBRIS_DB_URL:${db.url}}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.hikari.maximum-pool-size=10

server.port=${tomcat.http.port:9002}
server.error.include-message=always

# 本物の hybris のコンソールのログに近い形
logging.pattern.console=%-5level [%thread] [%logger{0}] %msg%n
logging.level.root=WARN
logging.level.de.hybris=INFO
logging.level.com.xyz=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# OCC の JSON(null は出さない、日付は本物と同じ形)
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ssZ
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
